services:
  # 1. Cơ sở dữ liệu PostgreSQL - Nguồn chân lý duy nhất (Single Source-of-Truth) cho Agent Leases, Runs, Checkpoints, Sessions
  postgres:
    image: postgres:16-alpine
    container_name: dezuxk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dezuxk
      POSTGRES_USER: dezuxk
      POSTGRES_PASSWORD: dezuxk_dev_cluster_pwd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dezuxk -d dezuxk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis - Tầng điều phối phân tán (Distributed Locks, Cross-Node EventBus SSE, Shared Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: dezuxk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. MinIO - Lưu trữ đối tượng S3 dùng chung cho media đa phương tiện
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: dezuxk-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data

  # 4. Gateway Node A
  gateway-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dezuxk-gateway-a
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - DEZUXK_HOST=0.0.0.0
      - DEZUXK_PORT=8080
      - DEZUXK_API_KEY=sk-dez-12f564ddef831e78546a198cd56f4deb
      - DEZUXK_CLUSTER_ENABLED=true
      - DEZUXK_CLUSTER_NODE_ID=gateway-node-a
      - DEZUXK_STORAGE_DRIVER=postgres
      - DEZUXK_POSTGRES_HOST=postgres
      - DEZUXK_POSTGRES_PORT=5432
      - DEZUXK_POSTGRES_USER=dezuxk
      - DEZUXK_POSTGRES_PASSWORD=dezuxk_dev_cluster_pwd
      - DEZUXK_POSTGRES_DBNAME=dezuxk
      - DEZUXK_DISTRIBUTED_ENABLED=true
      - DEZUXK_REDIS_ADDR=redis:6379
      - DEZUXK_MEDIA_DRIVER=s3
      - DEZUXK_S3_ENDPOINT=http://minio:9000
      - DEZUXK_S3_BUCKET=dezuxk-media
      - DEZUXK_S3_ACCESS_KEY=minioadmin
      - DEZUXK_S3_SECRET_KEY=minioadminpassword
      - DEZUXK_S3_USE_PATH_STYLE=true
      - DEZUXK_CHROME_BINARY=/usr/bin/chromium
      - DEZUXK_TEST_MODE=true
      - DEZUXK_MASTER_KEY=cluster_dev_master_key_32bytes_sec
      - DEZUXK_RATE_LIMIT_MAX_REQUESTS=30
      - DEZUXK_RATE_LIMIT_WINDOW_SECONDS=60
      - DEZUXK_PROFILES_CONTROL_PLANE_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ready"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  # 5. Gateway Node B
  gateway-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dezuxk-gateway-b
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - DEZUXK_HOST=0.0.0.0
      - DEZUXK_PORT=8080
      - DEZUXK_API_KEY=sk-dez-12f564ddef831e78546a198cd56f4deb
      - DEZUXK_CLUSTER_ENABLED=true
      - DEZUXK_CLUSTER_NODE_ID=gateway-node-b
      - DEZUXK_STORAGE_DRIVER=postgres
      - DEZUXK_POSTGRES_HOST=postgres
      - DEZUXK_POSTGRES_PORT=5432
      - DEZUXK_POSTGRES_USER=dezuxk
      - DEZUXK_POSTGRES_PASSWORD=dezuxk_dev_cluster_pwd
      - DEZUXK_POSTGRES_DBNAME=dezuxk
      - DEZUXK_DISTRIBUTED_ENABLED=true
      - DEZUXK_REDIS_ADDR=redis:6379
      - DEZUXK_MEDIA_DRIVER=s3
      - DEZUXK_S3_ENDPOINT=http://minio:9000
      - DEZUXK_S3_BUCKET=dezuxk-media
      - DEZUXK_S3_ACCESS_KEY=minioadmin
      - DEZUXK_S3_SECRET_KEY=minioadminpassword
      - DEZUXK_S3_USE_PATH_STYLE=true
      - DEZUXK_CHROME_BINARY=/usr/bin/chromium
      - DEZUXK_TEST_MODE=true
      - DEZUXK_MASTER_KEY=cluster_dev_master_key_32bytes_sec
      - DEZUXK_RATE_LIMIT_MAX_REQUESTS=30
      - DEZUXK_RATE_LIMIT_WINDOW_SECONDS=60
      - DEZUXK_PROFILES_CONTROL_PLANE_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ready"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  # 6. Gateway Node C
  gateway-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dezuxk-gateway-c
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - DEZUXK_HOST=0.0.0.0
      - DEZUXK_PORT=8080
      - DEZUXK_API_KEY=sk-dez-12f564ddef831e78546a198cd56f4deb
      - DEZUXK_CLUSTER_ENABLED=true
      - DEZUXK_CLUSTER_NODE_ID=gateway-node-c
      - DEZUXK_STORAGE_DRIVER=postgres
      - DEZUXK_POSTGRES_HOST=postgres
      - DEZUXK_POSTGRES_PORT=5432
      - DEZUXK_POSTGRES_USER=dezuxk
      - DEZUXK_POSTGRES_PASSWORD=dezuxk_dev_cluster_pwd
      - DEZUXK_POSTGRES_DBNAME=dezuxk
      - DEZUXK_DISTRIBUTED_ENABLED=true
      - DEZUXK_REDIS_ADDR=redis:6379
      - DEZUXK_MEDIA_DRIVER=s3
      - DEZUXK_S3_ENDPOINT=http://minio:9000
      - DEZUXK_S3_BUCKET=dezuxk-media
      - DEZUXK_S3_ACCESS_KEY=minioadmin
      - DEZUXK_S3_SECRET_KEY=minioadminpassword
      - DEZUXK_S3_USE_PATH_STYLE=true
      - DEZUXK_CHROME_BINARY=/usr/bin/chromium
      - DEZUXK_TEST_MODE=true
      - DEZUXK_MASTER_KEY=cluster_dev_master_key_32bytes_sec
      - DEZUXK_RATE_LIMIT_MAX_REQUESTS=30
      - DEZUXK_RATE_LIMIT_WINDOW_SECONDS=60
      - DEZUXK_PROFILES_CONTROL_PLANE_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ready"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  # 7. Nginx Load Balancer - Cân bằng tải Round-Robin không cần Sticky Sessions
  loadbalancer:
    image: nginx:alpine
    container_name: dezuxk-loadbalancer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
      gateway-c:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
