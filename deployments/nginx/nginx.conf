events {
    worker_connections 1024;
}

http {
    upstream dezuxk_cluster {
        # Round-robin cân bằng tải không dùng sticky session
        server gateway-a:8080 max_fails=3 fail_timeout=10s;
        server gateway-b:8080 max_fails=3 fail_timeout=10s;
        server gateway-c:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Tối ưu hóa timeout cho long-polling / SSE stream
        client_max_body_size 50M;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Điểm kiểm tra liveness và readiness của toàn cụm
        location /health {
            proxy_pass http://dezuxk_cluster/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ready {
            proxy_pass http://dezuxk_cluster/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cấu hình SSE (Server-Sent Events) không được đệm để real-time stream hoạt động tức thì
        location ~ ^/v1/agent/runs/[^/]+/events$ {
            proxy_pass http://dezuxk_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tắt đệm proxy cho SSE streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Định tuyến mặc định tới cụm Gateway
        location / {
            proxy_pass http://dezuxk_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
