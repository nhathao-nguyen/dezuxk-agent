events {
    worker_connections 2048;
}

http {
    upstream dezuxk_cluster {
        # Round-robin cân bằng tải không sticky session giữa các Gateway Node A/B/C
        server gateway-a:8080 max_fails=3 fail_timeout=10s;
        server gateway-b:8080 max_fails=3 fail_timeout=10s;
        server gateway-c:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Kích thước payload tối đa cho tải lên hình ảnh / tài liệu qua Multimodal Vision
        client_max_body_size 50M;

        # Thời gian chờ mặc định
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Tự động chuyển node tiếp theo nếu node hiện tại lỗi kết nối hoặc trả về 502/503
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        # Chuyển tiếp đầy đủ thông tin địa chỉ IP máy khách
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Health Liveness Probe (Kiểm tra tiến trình đang chạy)
        location /health {
            proxy_pass http://dezuxk_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 2. Readiness Probe (Kiểm tra tài khoản upstream Google & Model registry sẵn sàng)
        location /ready {
            proxy_pass http://dezuxk_cluster/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 3. Metrics Prometheus (Bảo vệ bằng Bearer token qua Gateway)
        location /metrics {
            proxy_pass http://dezuxk_cluster/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 4. SSE Stream cho Agent Runs Events (Không đệm buffer, timeout dài)
        location ~ ^/v1/agent/runs/[^/]+/events$ {
            proxy_pass http://dezuxk_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 5. SSE Stream cho OpenAI-compatible Chat Completions
        location = /v1/chat/completions {
            proxy_pass http://dezuxk_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 6. Stream cho các endpoint Model Discovery & Reasoning
        location ~ ^/v1/models/.+/stream$ {
            proxy_pass http://dezuxk_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 7. Dedicated Profile & CDP Control Plane (Định tuyến cố định về Node A)
        # Đảm bảo các tác vụ Chrome profile (create, launch, sync, ingest) tập trung tại Gateway Node A,
        # ngăn ngừa xung đột dữ liệu trình duyệt Chromium user-data-dir giữa các node.
        location ^~ /v1/profiles {
            proxy_pass http://gateway-a:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 8. Định tuyến tất cả API khác, Web Admin Dashboard và Agent traffic (Cân bằng tải Round-Robin HA qua Cluster)
        location / {
            proxy_pass http://dezuxk_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
