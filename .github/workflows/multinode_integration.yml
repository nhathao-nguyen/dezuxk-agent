name: Multi-Node Cluster Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Job 1: Deterministic Multi-Node Suite & Concurrency Race Detection
  deterministic-and-race:
    name: Deterministic & Race Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Deterministic Multi-Node Suite
        run: go test -v -count=1 ./tests/multinode/...

      - name: Tool Fencing Verification
        run: go test -v -count=1 ./internal/core/services/agent -run TestToolFencing

      - name: Race Verification
        run: go test -race -v -count=1 ./tests/multinode/...

      - name: Tool Fencing Race Verification
        run: go test -race -v -count=1 ./internal/core/services/agent -run TestToolFencing

  # Job 2: Real PostgreSQL, Redis & MinIO Infrastructure Integration
  infra-integration:
    name: Real PostgreSQL, Redis & MinIO Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dezuxk
          POSTGRES_PASSWORD: dezuxk_dev_cluster_pwd
          POSTGRES_DB: dezuxk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Start MinIO Server
        run: docker run -d --name minio -p 9000:9000 -p 9001:9001 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadminpassword cgr.dev/chainguard/minio:latest server /data

      - name: Wait for MinIO Server Ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO server sẵn sàng!"
              break
            fi
            echo "Chờ MinIO server..."
            sleep 1
          done

      - name: Real PostgreSQL Integration & Migration Concurrency
        env:
          TEST_POSTGRES_DSN: "postgres://dezuxk:dezuxk_dev_cluster_pwd@localhost:5432/dezuxk?sslmode=disable"
        run: go test -v -count=1 ./internal/adapters/outbound/storage/postgres/...

      - name: Real MinIO & S3 Integration
        env:
          TEST_POSTGRES_DSN: "postgres://dezuxk:dezuxk_dev_cluster_pwd@localhost:5432/dezuxk?sslmode=disable"
          TEST_S3_ENDPOINT: "http://localhost:9000"
          TEST_S3_BUCKET: "dezuxk-test"
          TEST_S3_ACCESS_KEY: "minioadmin"
          TEST_S3_SECRET_KEY: "minioadminpassword"
        run: go test -v -count=1 ./internal/adapters/outbound/storage/s3/...

      - name: Real Infrastructure Multi-Node Tests
        env:
          TEST_POSTGRES_DSN: "postgres://dezuxk:dezuxk_dev_cluster_pwd@localhost:5432/dezuxk?sslmode=disable"
          TEST_REDIS_ADDR: "localhost:6379"
          TEST_S3_ENDPOINT: "http://localhost:9000"
          TEST_S3_BUCKET: "dezuxk-test"
          TEST_S3_ACCESS_KEY: "minioadmin"
          TEST_S3_SECRET_KEY: "minioadminpassword"
        run: go test -v -count=1 ./tests/multinode/...

  # Job 3: Real 3-Gateway Cluster End-to-End & Chaos Verification
  real-cluster-e2e:
    name: Real 3-Gateway Cluster E2E
    runs-on: ubuntu-latest
    needs: [deterministic-and-race, infra-integration]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 3-Gateway Cluster Boot
        run: docker compose -f docker-compose.multinode.yml up -d --build

      - name: Wait for Real Cluster Health
        run: |
          for i in $(seq 1 60); do
            ready_a=0
            ready_b=0
            ready_c=0
            ready_lb=0
            curl -fsS http://localhost:8081/ready > /dev/null 2>&1 && ready_a=1
            curl -fsS http://localhost:8082/ready > /dev/null 2>&1 && ready_b=1
            curl -fsS http://localhost:8083/ready > /dev/null 2>&1 && ready_c=1
            curl -fsS http://localhost:8080/health > /dev/null 2>&1 && ready_lb=1
            if [ $ready_a -eq 1 ] && [ $ready_b -eq 1 ] && [ $ready_c -eq 1 ] && [ $ready_lb -eq 1 ]; then
              echo "Cụm Gateway A/B/C và Nginx Load Balancer đã READY thành công!"
              exit 0
            fi
            sleep 2
          done
          echo "LỖI: Cụm không đạt trạng thái ready trong thời gian quy định!"
          docker compose -f docker-compose.multinode.yml ps
          docker compose -f docker-compose.multinode.yml logs
          exit 1

      - name: Real HTTP Cross-Node Tests & Load Balancer
        env:
          TEST_CLUSTER_HTTP_E2E: "true"
        run: go test -v -count=1 -run "TestClusterProcess_" ./tests/multinode/...

      - name: Real Node Crash Test
        run: |
          echo "Ensuring Gateway Node A is running and healthy..."
          docker start dezuxk-gateway-a || true
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/ready > /dev/null 2>&1; then
              echo "Gateway Node A is ready!"
              break
            fi
            sleep 1
          done
          echo "Verifying cluster resiliency and proxy failover after Node A recovery..."
          curl -fsS http://localhost:8080/health > /dev/null
          curl -fsS http://localhost:8081/ready > /dev/null
          curl -fsS http://localhost:8082/ready > /dev/null
          curl -fsS http://localhost:8083/ready > /dev/null
          echo "Cluster fully healthy and ready after node failover."

      - name: Real Redis Failure Test
        run: |
          wait_for_status() {
            local url=$1
            local expected=$2
            local timeout=${3:-20}
            local start=$(date +%s)
            echo "Waiting for $url to return HTTP $expected (timeout: ${timeout}s)..."
            while true; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$status" = "$expected" ]; then
                echo "SUCCESS: $url returned HTTP $status"
                return 0
              fi
              local now=$(date +%s)
              if [ $((now - start)) -ge $timeout ]; then
                echo "ERROR: Timeout after ${timeout}s waiting for $url to return $expected (last status: $status)"
                docker compose -f docker-compose.multinode.yml ps
                docker compose -f docker-compose.multinode.yml logs
                return 1
              fi
              sleep 0.5
            done
          }

          echo "Stopping Redis..."
          docker stop dezuxk-redis
          wait_for_status http://localhost:8081/ready 503 15 || exit 1
          echo "Starting Redis..."
          docker start dezuxk-redis
          wait_for_status http://localhost:8081/ready 200 30 || exit 1
          echo "Redis recovery verified: Gateway A restored to 200 OK."

      - name: Real PostgreSQL Failure Test
        run: |
          wait_for_status() {
            local url=$1
            local expected=$2
            local timeout=${3:-20}
            local start=$(date +%s)
            echo "Waiting for $url to return HTTP $expected (timeout: ${timeout}s)..."
            while true; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$status" = "$expected" ]; then
                echo "SUCCESS: $url returned HTTP $status"
                return 0
              fi
              local now=$(date +%s)
              if [ $((now - start)) -ge $timeout ]; then
                echo "ERROR: Timeout after ${timeout}s waiting for $url to return $expected (last status: $status)"
                docker compose -f docker-compose.multinode.yml ps
                docker compose -f docker-compose.multinode.yml logs
                return 1
              fi
              sleep 0.5
            done
          }

          echo "Stopping PostgreSQL..."
          docker stop dezuxk-postgres
          wait_for_status http://localhost:8081/ready 503 15 || exit 1
          echo "Starting PostgreSQL..."
          docker start dezuxk-postgres
          wait_for_status http://localhost:8081/ready 200 30 || exit 1
          echo "PostgreSQL recovery verified: Gateway A restored to 200 OK."

      - name: Real MinIO Failure Test
        run: |
          wait_for_status() {
            local url=$1
            local expected=$2
            local timeout=${3:-20}
            local start=$(date +%s)
            echo "Waiting for $url to return HTTP $expected (timeout: ${timeout}s)..."
            while true; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$status" = "$expected" ]; then
                echo "SUCCESS: $url returned HTTP $status"
                return 0
              fi
              local now=$(date +%s)
              if [ $((now - start)) -ge $timeout ]; then
                echo "ERROR: Timeout after ${timeout}s waiting for $url to return $expected (last status: $status)"
                docker compose -f docker-compose.multinode.yml ps
                docker compose -f docker-compose.multinode.yml logs
                return 1
              fi
              sleep 0.5
            done
          }

          echo "Stopping MinIO..."
          docker stop dezuxk-minio
          wait_for_status http://localhost:8081/ready 503 15 || exit 1
          echo "Starting MinIO..."
          docker start dezuxk-minio
          wait_for_status http://localhost:8081/ready 200 30 || exit 1
          echo "MinIO recovery verified: Gateway A restored to 200 OK."

      - name: Collect Cluster Logs on Failure
        if: failure()
        run: |
          mkdir -p cluster-logs
          docker compose -f docker-compose.multinode.yml ps > cluster-logs/docker-compose-ps.txt || true
          docker compose -f docker-compose.multinode.yml logs gateway-a > cluster-logs/gateway-a.log || true
          docker compose -f docker-compose.multinode.yml logs gateway-b > cluster-logs/gateway-b.log || true
          docker compose -f docker-compose.multinode.yml logs gateway-c > cluster-logs/gateway-c.log || true
          docker compose -f docker-compose.multinode.yml logs loadbalancer > cluster-logs/loadbalancer.log || true
          docker compose -f docker-compose.multinode.yml logs postgres > cluster-logs/postgres.log || true
          docker compose -f docker-compose.multinode.yml logs redis > cluster-logs/redis.log || true
          docker compose -f docker-compose.multinode.yml logs minio > cluster-logs/minio.log || true

      - name: Upload Cluster Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-failure-logs
          path: cluster-logs/

      - name: Teardown Cluster
        if: always()
        run: docker compose -f docker-compose.multinode.yml down -v --remove-orphans || true
