name: Gemini Live Smoke Test

on:
  workflow_dispatch:
  schedule:
    # Scheduled daily run at 03:00 UTC (runs live test if lab secrets are configured)
    - cron: '0 3 * * *'

jobs:
  smoke:
    name: Live Google Upstream Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Execute Live Smoke Test
        env:
          GEMINI_LAB_COOKIE: ${{ secrets.GEMINI_LAB_COOKIE }}
          DEZUXK_LAB_COOKIE: ${{ secrets.DEZUXK_LAB_COOKIE }}
        run: |
          if [ -z "$GEMINI_LAB_COOKIE" ] && [ -z "$DEZUXK_LAB_COOKIE" ]; then
            echo "Lab secret unavailable; skipping live upstream test."
            exit 0
          fi
          echo "Lab secret is available. Running live upstream test against Google endpoint..."
          go test -v -count=1 -run TestGeminiChatGoldenJob_LiveLabAccount ./internal/adapters/outbound/google
